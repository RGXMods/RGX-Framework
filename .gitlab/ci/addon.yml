stages:
  - validate
  - contract
  - mirror

addon:validate:
  stage: validate
  image: node:22-alpine
  before_script:
    - apk add --no-cache lua5.1 libxml2-utils
  script:
    - test -s README.md
    - find . -maxdepth 1 -type f -name '*.toc' -print -quit | grep -q .
    - find . -type f -name '*.lua' -not -path './.git/*' -exec luac5.1 -p '{}' \;
    - find . -type f -name '*.xml' -not -path './.git/*' -exec xmllint --noout '{}' \;
    - >-
      if find . -type f
      \( -name '*.toc' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \)
      -not -path './.git/*'
      -not -path './.gitlab/ci/addon.yml'
      -exec grep -nEi 'WoWInterface|X-WoWI-ID|WOWI_API_TOKEN' '{}' +;
      then echo 'WoWInterface publishing is retired; remove the references above.' >&2; exit 1; fi
    - >-
      if test -f tools/ci/package-lock.json;
      then cd tools/ci && npm ci --no-audit --no-fund && npm run lua-check && npm run schema-check;
      fi

# Build the versioned contract bundle (issue #6) separately from the player
# archive, prove its hashes, and verify a rebuild is byte-identical.
contract:bundle:
  stage: contract
  image: node:22-alpine
  needs: ["addon:validate"]
  script:
    - cd tools/ci && npm ci --no-audit --no-fund
    - npm run contract-bundle-build
    - cd ../../artifacts && sha256sum * > /tmp/contract-bundle.sum
    - cd ../tools/ci && npm run contract-bundle-build
    - cd ../../artifacts && sha256sum -c /tmp/contract-bundle.sum
  artifacts:
    when: on_success
    paths:
      - artifacts/
    expire_in: 90 days
  # Only repos that ship the contract tooling can build the bundle. Addons
  # share this include but have no tools/ci, and an unguarded `cd tools/ci`
  # failed every addon pipeline that reached this stage.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists: tools/ci/package.json
    - if: '$CI_COMMIT_TAG'
      exists: tools/ci/package.json
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists: tools/ci/package.json

mirror:github:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""]
  needs: ["addon:validate"]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  resource_group: github-mirror-$CI_PROJECT_ID
  script:
    - test -n "$GITHUB_MIRROR_REPOSITORY"
    - test -n "$GITHUB_MIRROR_TOKEN"
    - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch origin --unshallow; fi
    - git fetch origin --prune "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    - git push "https://donniedice:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPOSITORY}.git" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" --prune
