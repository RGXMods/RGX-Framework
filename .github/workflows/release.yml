name: Package and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha*'

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate runtime, schema, flavors, and package boundary
        working-directory: tools/ci
        run: |
          npm ci --no-audit --no-fund
          npm run lua-check
          npm run lua-runtime-check
          npm run schema-check
          npm run flavor-check
          npm run package-check
          npm run docs-check

      - name: Validate canonical wiki sources
        run: node tools/wiki/build-wiki.mjs "${RUNNER_TEMP}/wiki-out"

      - name: Install source conformance fixture
        working-directory: tools/rgx-mcp
        run: npm ci --no-audit --no-fund

      - name: Validate contract against RGX-Hello
        run: |
          git clone --depth 1 https://github.com/RGXMods/RGX-Hello.git "${RUNNER_TEMP}/RGX-Hello"
          node tools/rgx-mcp/test/test-rgx-hello.mjs "${RUNNER_TEMP}/RGX-Hello"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure Git User
        run: |
          git config --global user.name "donniedice"
          git config --global user.email "donniedice@protonmail.com"

      - name: Determine Release Type
        id: release_type
        run: |
          case "${{ github.ref }}" in
            refs/tags/*)
              if [[ "${{ github.ref }}" == *"beta"* ]]; then
                echo "type=beta" >> $GITHUB_OUTPUT
              elif [[ "${{ github.ref }}" == *"alpha"* ]]; then
                echo "type=alpha" >> $GITHUB_OUTPUT
              else
                echo "type=release" >> $GITHUB_OUTPUT
              fi
              ;;
            refs/heads/dev)
              echo "type=dev" >> $GITHUB_OUTPUT
              ;;
            refs/heads/alpha)
              echo "type=alpha-branch" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "type=unknown" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Extract Version from TOC
        id: version
        run: |
          version=$(grep -oP '^## Version: \K(.*)' RGX-Framework.toc)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> $GITHUB_OUTPUT

      - name: Validate Release Metadata
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          curse_id="$(grep -oP '^## X-Curse-Project-ID:\s*\K(.*)' RGX-Framework.toc || true)"
          wago_id="$(grep -oP '^## X-Wago-ID:\s*\K(.*)' RGX-Framework.toc || true)"

          echo "Detected project IDs:"
          echo "  X-Curse-Project-ID: ${curse_id:-missing}"
          echo "  X-Wago-ID: ${wago_id:-missing}"

          if [[ -z "$curse_id" ]]; then
            echo "::warning::X-Curse-Project-ID is missing in RGX-Framework.toc. CurseForge upload will be skipped."
          fi

          if [[ -z "$wago_id" ]]; then
            echo "::warning::X-Wago-ID is missing in RGX-Framework.toc. Wago upload will be skipped."
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            norm_tag="${tag#v}"
            norm_ver="${version#v}"
            snapshot_version="$(node -p "require('./tools/ci/release-snapshot.json').version")"
            published_version="$(node -p "require('./tools/ci/release-snapshot.json').publishedVersion || require('./tools/ci/release-snapshot.json').version")"

            if [[ "$norm_tag" != "$norm_ver" ]]; then
              echo "::error::Tag '$tag' does not match RGX-Framework.toc version '$version'."
              exit 1
            fi

            if [[ "$norm_tag" != "${snapshot_version#v}" ]]; then
              echo "::error::Tag '$tag' does not match release snapshot version '$snapshot_version'."
              exit 1
            fi

            if [[ "$norm_tag" != "${published_version#v}" ]]; then
              echo "::error::Tag '$tag' cannot publish while public surfaces still identify '$published_version' as the latest release."
              exit 1
            fi

            if [[ -n "$curse_id" && -z "${CF_API_KEY:-}" ]]; then
              echo "::error::CF_API_KEY secret is missing but X-Curse-Project-ID is set. CurseForge upload cannot run."
              exit 1
            fi
          fi

      - name: Extract Latest Changelog
        id: changelog
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          short_version="${version#v}"

          if [[ -f "docs/changelogs/${short_version}.md" ]]; then
            changelog_content="$(cat "docs/changelogs/${short_version}.md")"
          elif [[ -f "docs/CHANGES.md" ]]; then
            changelog_content="$(awk '
              /^## / {
                if (started) { exit }
                started=1
              }
              started { print }
            ' docs/CHANGES.md)"
          else
            changelog_content="No changelog available."
          fi

          {
            echo "body<<EOF"
            echo "$changelog_content"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          bullet_lines="$(echo "$changelog_content" | grep -E '^[-*]|^\*\*' | head -20 | sed 's/^\*\*[^*]*\*\*[[:space:]]*//' )"
          if ((${#bullet_lines} > 980)); then
            bullet_lines="${bullet_lines:0:977}..."
          fi

          {
            echo "discord_summary<<EOF"
            echo "$bullet_lines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # The in-house publisher reads the release notes from this file.
          printf '%s\n' "$changelog_content" > "${RUNNER_TEMP}/release-notes.md"

      - name: Build release archive
        working-directory: tools/ci
        run: npm run package-build

      - name: Inspect release archive before upload
        id: preflight
        working-directory: tools/ci
        run: |
          version="${{ steps.version.outputs.version }}"
          runtime_files="$(node -p "require('./release-snapshot.json').runtimeFiles")"
          archive="../../artifacts/RGX-Framework-v${version}.zip"
          node package-manifest-check.mjs ../.. --inspect "$archive" --expected-count "$runtime_files"

          actual_sha="$(sha256sum "$archive" | awk '{ print toupper($1) }')"
          echo "sha256=$actual_sha" >> $GITHUB_OUTPUT
          echo "runtime_files=$runtime_files" >> $GITHUB_OUTPUT

      - name: Publish Release
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          node tools/release/publish-release.mjs \
            --toc RGX-Framework.toc \
            --archive "artifacts/RGX-Framework-v${version}.zip" \
            --tag "${GITHUB_REF_NAME}" \
            --release-type "${{ steps.release_type.outputs.type }}" \
            --changelog-file "${RUNNER_TEMP}/release-notes.md" \
            --out artifacts

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          published="${RUNNER_TEMP}/published-release"
          mkdir -p "$published"
          gh release download "${GITHUB_REF_NAME}" --pattern "RGX-Framework-v${version}.zip" --pattern "release.json" --dir "$published"

          actual="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' "RGX-Framework-v${version}.zip" "release.json" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected published assets"
            echo "Expected:"
            echo "$expected"
            echo "Actual:"
            echo "$actual"
            exit 1
          fi

          runtime_files="${{ steps.preflight.outputs.runtime_files }}"
          node tools/ci/package-manifest-check.mjs . --inspect "$published/RGX-Framework-v${version}.zip" --expected-count "$runtime_files"
          node tools/ci/release-metadata-check.mjs "$published/release.json"

          expected_sha="${{ steps.preflight.outputs.sha256 }}"
          actual_sha="$(sha256sum "$published/RGX-Framework-v${version}.zip" | awk '{ print toupper($1) }')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Published ZIP SHA-256 does not match the inspected preflight archive"
            echo "Expected: $expected_sha"
            echo "Actual:   $actual_sha"
            exit 1
          fi

      - name: Send Discord Notification
        if: success()
        shell: bash
        env:
          DISCORD_SUMMARY: ${{ steps.changelog.outputs.discord_summary }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TIMESTAMP: ${{ steps.version.outputs.timestamp }}
        run: |
          if [[ -z "${DISCORD_WEBHOOK:-}" ]]; then
            echo "::warning::DISCORD_WEBHOOK secret is empty - skipping Discord notification."
            exit 0
          fi

          summary="${DISCORD_SUMMARY}"
          release_type="${RELEASE_TYPE}"
          version="${RELEASE_VERSION}"
          tag="${RELEASE_TAG}"

          case "$release_type" in
            "release")
              title="RGX-Framework ${version}"
              color=385018
              footer="RGX Mods • Stable Release"
              description="A new stable release of the RGX shared library is live."
              release_url="https://github.com/RGXMods/RGX-Framework/releases/tag/${tag}"
              downloads="[CurseForge](https://www.curseforge.com/wow/addons/rgx-framework) • [GitHub](${release_url})"
              channel="Release"
              ;;
            "beta")
              title="RGX-Framework ${version} (Beta)"
              color=16744448
              footer="RGX Mods • Beta Build"
              description="Beta build available for testing."
              release_url="https://github.com/RGXMods/RGX-Framework/releases/tag/${tag}"
              downloads="[CurseForge](https://www.curseforge.com/wow/addons/rgx-framework) • [GitHub](${release_url})"
              channel="Beta"
              ;;
            "alpha"|"alpha-branch")
              title="RGX-Framework ${version} (Alpha)"
              color=9109504
              footer="RGX Mods • Alpha Build"
              description="Alpha build available for testing."
              release_url="https://github.com/RGXMods/RGX-Framework/releases/tag/${tag}"
              downloads="[GitHub](${release_url})"
              channel="Alpha"
              ;;
            "dev")
              title="RGX-Framework ${version} (Dev)"
              color=3447003
              footer="RGX Mods • Dev Build"
              description="Development build from the dev branch."
              release_url="https://github.com/RGXMods/RGX-Framework/tree/dev"
              downloads="[GitHub Dev Branch](${release_url})"
              channel="Dev"
              ;;
            *)
              title="RGX-Framework ${version}"
              color=10000000
              footer="RGX Mods"
              description="Build completed."
              release_url="https://github.com/RGXMods/RGX-Framework/releases"
              downloads="[GitHub](${release_url})"
              channel="Unknown"
              ;;
          esac

          jq -n \
            --arg username "RGX-Framework Releases" \
            --arg avatar_url "https://raw.githubusercontent.com/RGXMods/RGX-Framework/main/media/logo.png" \
            --arg title "$title" \
            --arg url "$release_url" \
            --arg description "$description" \
            --argjson color "$color" \
            --arg footer "$footer" \
            --arg icon_url "https://raw.githubusercontent.com/RGXMods/SimpleQuestPlates/main/media/kiwi.gif" \
            --arg timestamp "${RELEASE_TIMESTAMP}" \
            --arg summary "$summary" \
            --arg downloads "$downloads" \
            --arg channel "$channel" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: $color,
                fields: [
                  { name: "What'\''s New", value: $summary, inline: false },
                  { name: "Downloads", value: $downloads, inline: false },
                  { name: "Channel", value: $channel, inline: true }
                ],
                footer: { text: $footer, icon_url: $icon_url },
                timestamp: $timestamp
              }]
            }' > payload.json

          http_code=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST -d @payload.json "$DISCORD_WEBHOOK")
          echo "Discord webhook HTTP status: $http_code"
          if [[ "$http_code" != 2* ]]; then
            echo "::error::Discord notification failed (HTTP $http_code):"
            cat /tmp/discord_resp.txt
            exit 1
          fi

      - name: Send Failure Notification
        if: failure()
        shell: bash
        run: |
          if [[ -z "${DISCORD_WEBHOOK:-}" ]]; then
            echo "::warning::DISCORD_WEBHOOK secret is empty - skipping failure notification."
            exit 0
          fi
          version="${{ steps.version.outputs.version }}"
          run_id="${{ github.run_id }}"
          timestamp="${{ steps.version.outputs.timestamp }}"
          jq -n \
            --arg version "${version:-Unknown}" \
            --arg run_id "$run_id" \
            --arg timestamp "$timestamp" \
            '{
              username: "RGX-Framework Build Failed",
              avatar_url: "https://raw.githubusercontent.com/RGXMods/RGX-Framework/main/media/logo.png",
              embeds: [{
                title: "RGX-Framework Build Failed",
                description: "The release workflow encountered an error",
                url: ("https://github.com/RGXMods/RGX-Framework/actions/runs/" + $run_id),
                color: 15158332,
                fields: [
                  { name: "Version", value: $version, inline: true },
                  { name: "Workflow", value: ("https://github.com/RGXMods/RGX-Framework/actions/runs/" + $run_id), inline: true }
                ],
                footer: {
                  text: "RGX Mods - Build System",
                  icon_url: "https://raw.githubusercontent.com/RGXMods/RGX-Framework/main/media/logo.png"
                },
                timestamp: $timestamp
              }]
            }' > payload.json
          curl -s -H "Content-Type: application/json" -X POST -d @payload.json "$DISCORD_WEBHOOK"
